<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大陸の地形と気候</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column — region switch, view controls, the 3D relief, then legend and the tapped point's climograph */
:root{
  --bg:#F2F4F3;--panel:#FFFFFF;--fg:#1C2326;--muted:#5D6A6F;--line:#D3DAD9;--accent:#1F5F8B;--accent-soft:#DCE8F1;--sea:#2E6896;--warm:#B3202A;--cold:#1F4FB0;--localw:#6E1F96;--monsoon:#A35400;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121719;--panel:#1A2124;--fg:#E4EAEA;--muted:#93A2A6;--line:#2E393D;--accent:#7FB3DA;--accent-soft:#1D3344;--sea:#244F72;--warm:#FF8A8F;--cold:#8FB4FF;--localw:#D9A6F2;--monsoon:#FFB86B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121719;--panel:#1A2124;--fg:#E4EAEA;--muted:#93A2A6;--line:#2E393D;--accent:#7FB3DA;--accent-soft:#1D3344;--sea:#244F72;--warm:#FF8A8F;--cold:#8FB4FF;--localw:#D9A6F2;--monsoon:#FFB86B;color-scheme:dark}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:12px}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.regions{display:flex;flex-wrap:wrap;gap:6px}
.regions button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 14px var(--font-body);padding:6px 12px;border-radius:6px;cursor:pointer}
.regions button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:14px var(--font-body);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.month{display:flex;align-items:center;gap:10px}
.month input{flex:1;accent-color:var(--accent)}
.month output{font:500 14px var(--font-data);min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.play{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-size:13px}
.stage{position:relative;height:460px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.stage canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;font-size:12px}
#labels span{position:absolute;transform:translate(-50%,-150%);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
#status{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;margin:0}
 #ovlabels{position:absolute;inset:0;pointer-events:none}
#ovlabels span{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;padding:0 5px;border-radius:4px;background:var(--panel);white-space:nowrap;border:1px solid currentColor}
#ovlabels .warm{color:var(--warm)}#ovlabels .cold{color:var(--cold)}#ovlabels .local{color:var(--localw);font-weight:700}#ovlabels .monsoon{color:var(--monsoon)}
.ovrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.ovrow .lab{font-size:13px;color:var(--muted)}
.lw{margin:0;padding:10px 14px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.lw b{color:var(--localw);margin-right:8px}
.hint{position:absolute;left:8px;bottom:8px;margin:0;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:20px;height:12px;border:1px solid rgba(0,0,0,.35);display:inline-block}
.legend b{font:500 13px var(--font-data)}
.probe{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.probe h2{font-size:16px;margin:0;font-weight:700}
.probe .meta{margin:0;color:var(--muted);font:13px var(--font-data);font-variant-numeric:tabular-nums}
#chart{width:100%;height:auto;display:block}
.note{color:var(--muted);font-size:12.5px;margin:0;max-width:65ch}
@media (max-width:520px){.stage{height:380px}h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>大陸の地形と気候</h1>
      <p class="sub">風と雨の仕組みから気温・降水量を計算し、ケッペンの式で塗り分けています</p>
    </div>
    <div class="regions" id="regions" role="group" aria-label="地域"></div>
  </header>
  <div class="row" role="group" aria-label="表示">
    <button class="chip" id="m-terrain" data-mode="terrain" aria-pressed="false">地形</button>
    <button class="chip" id="m-koppen" data-mode="koppen" aria-pressed="true">気候区分</button>
    <button class="chip" id="m-temp" data-mode="temp" aria-pressed="false">気温</button>
    <button class="chip" id="m-prec" data-mode="prec" aria-pressed="false">降水量</button>
    <span style="flex:1"></span>
    <button class="chip" id="pins-toggle" aria-pressed="false">都市名を隠す</button>
  </div>
  <div class="ovrow" role="group" aria-label="重ねて表示">
    <span class="lab">重ねて表示</span>
    <button class="chip" id="ov-winds" data-ov="winds" aria-pressed="false">恒常風</button>
    <button class="chip" id="ov-monsoon" data-ov="monsoon" aria-pressed="false">季節風</button>
    <button class="chip" id="ov-currents" data-ov="currents" aria-pressed="false">海流</button>
    <button class="chip" id="ov-local" data-ov="local" aria-pressed="false">局地風</button>
  </div>
  <div class="month">
    <button class="play" id="play" aria-label="月を再生">▶</button>
    <input type="range" id="month" min="1" max="12" step="1" value="1" aria-label="月">
    <output id="month-out" for="month">1月</output>
  </div>
  <div class="stage" id="stage">
    <div id="labels"></div>
    <div id="ovlabels"></div>
    <p id="status">計算中…</p>
    <p class="hint">ドラッグで回転・ピンチで拡大・タップで地点の雨温図</p>
  </div>
  <div class="legend" id="legend"></div>
  <ul class="lw" id="localwinds" hidden></ul>
  <section class="probe" aria-live="polite">
    <h2 id="p-title">地点を選んでください</h2>
    <p class="meta" id="p-meta">地図上の陸地をタップすると、その地点の雨温図が出ます</p>
    <canvas id="chart" width="640" height="200" aria-label="雨温図"></canvas>
  </section>
  <p class="note">標高は主な山脈や高原を数式で近似したもので、高さは強調しています。気温と降水量も簡略化したモデルなので、実際の気候図とずれる場所があります（例：キンシャサは実際はAw）。ロシアは東経180度より東のチュコト半島の先端、アングロアメリカはアリューシャン列島の西端とハワイを省いています。</p>
</div>

<script>
function sq(x){return x*x}

  elev(lon,lat){const ax=lerpT(SA_AX,lat),d=lon-ax,w=lerpT(SA_WD,lat),pw=(lat<-13&&lat>-24)?4:2;

  cell(lon,lat,D){const dc=Math.min(D.dE,D.dW,D.dN,D.dS),ax=lerpT(SA_AX,lat),east=lon>ax,a=Math.abs(lat);
    let h=this.elev(lon,lat);h=20+(h-20)*Math.min(1,(dc+0.3)/1.5);const H=Math.max(0,h);
    const cold=(!east)?Math.exp(-D.dW/1.5)*sig((lat+36)/1.5)*sig((-2-lat)/1.5):0;

    for(let m=0;m<12;m++){const s=Math.cos(2*Math.PI*m/12),sum=Math.max(0,s),win=Math.max(0,-s);
      T.push(Ta+(lat<0?1:-1)*amp*s);
      let p=6;
      if(east){const c=-4.5-11.5*s,bw=lat>c?8:9;p+=250*Math.exp(-sq((lat-c)/bw))*sig((lat+32)/2)+20*g(lon,lat,-46,-23,40,10);
        p+=130*g(lon,lat,-67,-4,100,40)+160*Math.exp(-D.dE/4)*g(lon,lat,-52,0,60,25)*(1+0.5*cosm(m,3.5));

        p+=85*g(lon,lat,-54,-30,60,25)*(1+0.15*s)+60*sum*g(lon,lat,-58,-34,40,25)+70*g(lon,lat,-58,-33,50,30)+35*sum*g(lon,lat,-62,-27,40,30);
        p*=1-0.75*g(lon,lat,-40,-8,12,10);
        p*=1-0.7*win*sig((-61-lon)/1.5)*sig((lat+36)/2)*sig((-18-lat)/2);
        p*=1-0.9*g(lon,lat,-69.5,-40,12,150)*sig((-30-lat)/2)-0.6*g(lon,lat,-67,-30,4,8);
        p*=1-0.6*g(lon,lat,-67.5,-19,4,9);
        p*=1+0.8*yung;}
      else{p+=400*g(lon,lat,-77.5,5,4,25)*(lat>-2?1:0);
        const cw=-45-6*s;p+=260*Math.exp(-sq((lat-cw)/7))+(lat<-42?120:0);
        p*=1-0.95*sig((lat+31)/1.5)*sig((-1-lat)/1.5);}
      p*=1-0.7*g(lon,lat,-70,11.5,20,1.5);

    return{h,T,P}}
};

const AF_IDS=new Set(['012','024','072','108','120','132','140','148','174','178','180','204','226','231','232','262','266','270','288','324','384','404','426','430','434','450','454','466','478','480','504','508','516','562','566','624','646','686','694','706','710','716','728','729','732','748','768','788','800','818','834','854','894','678']);
const AF={

  focus:x=>AF_IDS.has(String(x.id))||(x.properties&&x.properties.name==='Somaliland'),
  pins:[['カイロ',31.2,30],['ラゴス',3.4,6.5],['キンシャサ',15.3,-4.3],['ナイロビ',36.8,-1.3],['ケープタウン',18.5,-33.95]],start:[36.8,-1.3],
  elev(lon,lat){let h=350;

    return h+40*Math.sin(lon*1.7)*Math.cos(lat*1.3)+25*Math.sin(lon*4.1+lat*3.3)},
  cell(lon,lat,D){const dc=Math.min(D.dE,D.dW,D.dN,D.dS);let h=this.elev(lon,lat);h=30+(h-30)*Math.min(1,(dc+0.3)/2.5);
    const atl=lat<31&&D.wl<14&&D.wl>-99;
    const cw=atl?Math.exp(-D.dW/2.5)*(sig((lat+32)/1.5)*sig(-(lat+10)/1.5)+sig((lat-14)/1.5)*sig(-(lat-30)/1.5)):0;
    const T=[],P=[],a=Math.abs(lat);
    for(let m=0;m<12;m++){const s=Math.cos(2*Math.PI*m/12);
      let t=27.5-0.011*Math.pow(a,1.9)+4.5*g(lon,lat,8,21,250,50);
      t+=(lat<0?1:-1)*Math.min(7.5,0.2*a+0.5)*(0.65+0.35*Math.min(1,dc/4))*s;T.push(t-6*cw-Math.max(0,h)*0.0055);
      const wj=Math.min(1,Math.max(0,(lon-5)/12)),cJ=-3*(1-wj)-16*wj,cU=11,c=(cJ+cU)/2+(cJ-cU)/2*s;

      p+=70*Math.exp(-sq((lat+1)/7))*g(lon,lat,20,0,120,60);
      p+=250*Math.max(0,-s)*g(lon,lat,-11.5,8.5,10,8)+300*Math.max(0,0.3-0.7*s)*g(lon,lat,9.7,4,2,4);
      p*=1-0.5*g(lon,lat,1,6,6,2);p*=1-0.85*g(lon,lat,46,5,60,40);p*=1-0.6*g(lon,lat,15,24,250,25);

      p*=Math.max(0.03,1-1.2*Math.pow(cw,0.6));p*=1+Math.min(0.7,Math.max(0,h-600)/2500);P.push(p+4)}
    return{h,T,P}}

const EU_IDS=new Set(['008','020','040','056','070','100','112','191','203','208','233','246','250','276','300','348','352','372','380','428','438','440','442','470','492','498','499','528','578','616','620','642','674','688','703','705','724','752','756','804','807','826','336','234','831','832','833','248']);
const SCAN=[[70,23],[68.5,18],[65,13.5],[61.5,8.5],[58.5,6.5]];
const EU={
  L0:-25,L1:45,T0:72,T1:34,EX:0.0012,xs:0.65,cam:[4,40,46],target:[0,0,1],
  focus:x=>EU_IDS.has(String(x.id))||(x.properties&&x.properties.name==='Kosovo'),
  pins:[['ロンドン',-0.1,51.5],['パリ',2.35,48.85],['マドリード',-3.7,40.4],['ローマ',12.5,41.9],['ストックホルム',18.07,59.33],['キーウ',30.5,50.45]],start:[-0.1,51.5],
  elev(lon,lat){let h=120;

      const len=step*0.45,dl=u/mag*len/xs*0.5,dt=v/mag*len*0.5,y=hAtLL(lon,lat)+S*0.02;
      const [x1,z1]=toXZ(reg,lon-dl,lat-dt),[x2,z2]=toXZ(reg,lon+dl,lat+dt);
      arrowTube([new THREE.Vector3(x1,y,z1),new THREE.Vector3((x1+x2)/2,y,(z1+z2)/2),new THREE.Vector3(x2,y,z2)],0xE07A00,r*1.0*mag,0.95);
      const nm=fromName(u,v)+'の季節風',key=nm;if(!done.has(key)&&mag>0.6){done.add(key);addLabel(nm,new THREE.Vector3((x1+x2)/2,y+S*0.012,(z1+z2)/2),'ov monsoon')}}}
  if(OV.currents){const seen=new Set();CURRENTS.forEach(([name,warm,pl])=>{const d=densify(pl,0.5);let run=[];const runs=[];
      d.forEach(p=>{if(inReg(reg,p[0],p[1],0)){run.push(p)}else{if(run.length>2)runs.push(run);run=[]}});if(run.length>2)runs.push(run);
      runs.forEach(rn=>{const pts=rn.map(([lo,la])=>{const [x,z]=toXZ(reg,lo,la);return new THREE.Vector3(x,0.08,z)});arrowTube(pts,warm?0xD3303B:0x1F5FD0,r*1.1,0.95);
        if(!seen.has(name)||rn.length>20){seen.add(name);addLabel(name,pts[Math.floor(pts.length/2)].clone().setY(0.6),warm?'ov warm':'ov cold')}})})}
  if(OV.local){const items=[];LOCAL_WINDS.forEach(([name,a,b,desc])=>{if(!inReg(reg,a[0],a[1],1)&&!inReg(reg,b[0],b[1],1))return;
      const pts=densify([a,b],0.4).map(([lo,la],k,arr)=>{const [x,z]=toXZ(reg,lo,la),t=k/(arr.length-1);return new THREE.Vector3(x,hAtLL(lo,la)+S*0.015+Math.sin(Math.PI*t)*S*0.02,z)});
      arrowTube(pts,0x8A2BB8,r*1.2,0.95);addLabel(name,pts[0].clone().setY(pts[0].y+S*0.01),'ov local');items.push([name,desc])});
    if(items.length){list.innerHTML=items.map(([n,d])=>`<li><b>${n}</b>${d}</li>`).join('');list.hidden=false}}
  drawLegend()}
document.querySelectorAll('[data-ov]').forEach(b=>b.onclick=()=>{const k=b.dataset.ov;OV[k]=!OV[k];b.setAttribute('aria-pressed',OV[k]);buildOverlays()});

function showRegion(key){key=ALIAS[key]||key;if(!REGIONS[key])key=DEFAULT_REGION;
  document.querySelectorAll('[data-region]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.region===key));
  if(!world)return;
  statusEl.hidden=false;statusEl.textContent='計算中…';
  setTimeout(()=>{try{
    while(group3.children.length)group3.remove(group3.children[0]);labelsEl.innerHTML='';pins=[];
    cur=compute(key);const reg=cur.reg;group3.add(cur.mesh);
    reg.pins.forEach(p=>{const i=idx(p[1],p[2]),[x,z]=toXZ(reg,p[1],p[2]),y=Math.max(0,i<0?0:cur.HH[i])*reg.EX;
      const s=new THREE.Mesh(new THREE.SphereGeometry(0.45,14,10),new THREE.MeshBasicMaterial({color:0x2C2C2A}));s.position.set(x,y+0.9,z);s.visible=showPins;group3.add(s);
      const el=document.createElement('span');el.textContent=p[0];labelsEl.appendChild(el);pins.push([s.position,el,s])});
    marker=new THREE.Mesh(new THREE.ConeGeometry(0.55,1.5,12),new THREE.MeshBasicMaterial({color:0xD85A30}));marker.rotation.x=Math.PI;marker.visible=false;group3.add(marker);
    if(reg.cam){cam.position.set(...reg.cam);ctl.target.set(...reg.target)}else{const S=Math.max((reg.L1-reg.L0)*(reg.xs||1)*0.75,reg.T0-reg.T1);cam.position.set(0,0.95*S,1.05*S);ctl.target.set(0,0,S*0.03)}ctl.update();
    recolor();probe(...reg.start);buildOverlays();statusEl.hidden=true}catch(e){statusEl.textContent='計算に失敗しました：'+e.message}},30)}

const regionsEl=document.getElementById('regions');REGION_LIST.forEach(([k,label])=>{const b=document.createElement('button');b.id='r-'+k;b.dataset.region=k;b.textContent=label;b.setAttribute('aria-pressed','false');regionsEl.appendChild(b)});
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{if(location.hash!=='#'+b.dataset.region)location.hash=b.dataset.region;else showRegion(b.dataset.region)});
window.addEventListener('hashchange',()=>showRegion(location.hash.slice(1)));
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
const pinBtn=document.getElementById('pins-toggle');pinBtn.onclick=()=>{showPins=!showPins;pinBtn.setAttribute('aria-pressed',!showPins);pinBtn.textContent=showPins?'都市名を隠す':'都市名を表示';pins.forEach(p=>p[2].visible=showPins)};
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===m));recolor()}
const slider=document.getElementById('month'),out=document.getElementById('month-out'),play=document.getElementById('play');
function setMonth(m){month=m;slider.value=m+1;out.textContent=(m+1)+'月';if(mode==='temp'||mode==='prec')recolor();if(OV.winds||OV.monsoon)buildOverlays()}
slider.oninput=()=>setMonth(+slider.value-1);
play.onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='▶';play.setAttribute('aria-label','月を再生')}else{if(mode!=='temp'&&mode!=='prec')setMode('prec');timer=setInterval(()=>setMonth((month+1)%12),700);play.textContent='❚❚';play.setAttribute('aria-label','一時停止')}};

let down=null;const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
ren.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
ren.domElement.addEventListener('pointerup',e=>{if(!down||!cur)return;if(Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  const rc=ren.domElement.getBoundingClientRect();ndc.set((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);ray.setFromCamera(ndc,cam);
  const hit=ray.intersectObject(cur.mesh)[0];if(hit)probe(hit.point.x/(cur.reg.xs||1)+(cur.reg.L0+cur.reg.L1)/2,(cur.reg.T0+cur.reg.T1)/2-hit.point.z)});

const v=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);ctl.update();ren.render(scene,cam);
  pins.forEach(([p,el])=>{v.copy(p).project(cam);el.style.left=((v.x+1)/2*W)+'px';el.style.top=((1-v.y)/2*H)+'px';el.hidden=!showPins||v.z>=1});
  ovLabels.forEach(([p,el])=>{v.copy(p).project(cam);el.style.left=((v.x+1)/2*W)+'px';el.style.top=((1-v.y)/2*H)+'px';el.hidden=v.z>=1})}
loop();
new ResizeObserver(()=>{W=stage.clientWidth;H=stage.clientHeight;ren.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix()}).observe(stage);
const mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',()=>{if(cur&&selected)probe(...selected)});

const getJSON=u=>fetch(u).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
getJSON('countries-50m.json').catch(()=>getJSON('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json')).then(w=>{world=w;showRegion(location.hash.slice(1)||DEFAULT_REGION)})
  .catch(e=>{statusEl.textContent='地図データを読み込めませんでした（'+e.message+'）。ページを再読み込みしてください'});
</script>

</body>
</html>
